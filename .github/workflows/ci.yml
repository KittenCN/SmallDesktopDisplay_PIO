name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp12e
          - esp12e_smartconfig
          - esp12e_dht
          - esp12e_no_animation
          - esp12e_astronaut
          - esp12e_hutao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - run: pio run -e ${{ matrix.environment }}
      - name: Enforce default firmware size budget
        if: matrix.environment == 'esp12e'
        shell: bash
        run: |
          actual=$(stat -c%s .pio/build/esp12e/firmware.bin)
          maximum=925000
          echo "firmware.bin: ${actual} bytes (budget ${maximum})"
          test "${actual}" -le "${maximum}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - run: python -B -m unittest discover -s tools/font_translate/tests -v
      - run: python -B -m unittest discover -s test/host -v
      - run: pio test -e native_test
      - run: pio test -e esp12e_test --without-uploading --without-testing
      - name: Reject tracked build products
        shell: bash
        run: |
          if git ls-files | grep -E '^(\.pio|build)/|(^|/)__pycache__/|\.pyc$|\.DS_Store$'; then
            echo "Generated files must not be committed"
            exit 1
          fi

  simulator-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build Windows simulator
        shell: pwsh
        run: .\tools\build_simulator.ps1 -Configuration Release -Clean
      - name: Run deterministic simulator self-tests
        shell: pwsh
        run: .\tools\test_simulator.ps1 -Configuration Release -SkipBuild
      - name: Verify tests did not rewrite tracked scenarios or assets
        shell: pwsh
        run: git diff --exit-code
      - name: Package portable Windows simulator
        shell: pwsh
        run: .\tools\package_simulator.ps1 -Configuration Release -SkipBuild
      - name: Upload portable simulator
        uses: actions/upload-artifact@v4
        with:
          name: SmallDesktopDisplaySimulator-windows-x64
          path: build/packages/SmallDesktopDisplaySimulator-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
