; SmallDesktopDisplay PlatformIO configuration
; Hardware: ESP8266 NodeMCU v2 + 240x240 ST7789 TFT

[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266@2.6.3
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 3000000
extra_scripts = extra_script.py

; Keep the display wiring in the project. Do not edit a downloaded
; TFT_eSPI/User_Setup.h: an isolated checkout must build identically.
build_flags =
	-D USER_SETUP_LOADED=1
	-D ST7789_2_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_CS=15
	-D TFT_DC=0
	-D TFT_RST=2
	-D TFT_BL=5
	-D TOUCH_CS=-1
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=27000000
	-Wall
	-Wextra
	-Wno-unused-variable
	-Wno-deprecated-declarations

lib_deps =
	adafruit/DHT sensor library@1.4.7
	bblanchon/ArduinoJson@6.21.6
	lennarthennigs/Button2@1.6.5
	bodmer/TJpg_Decoder@1.1.0
	bodmer/TFT_eSPI@2.5.43
	paulstoffregen/Time@1.6.1
	tzapu/WiFiManager@2.0.17
	ivanseidel/Thread@0.0.0-alpha+sha.1a4e504c5f

[env:esp12e_test]
extends = env:esp12e
test_build_src = no
test_filter = test_display_logic
test_framework = unity

[env:native_test]
platform = native
test_build_src = no
test_filter = test_display_logic
test_framework = unity
build_flags =
	-std=c++11
	-Wall
	-Wextra
	-Werror

; Compile-only feature matrix used by CI/review. These are not default upload
; targets, but ensure optional code paths do not silently rot.
[env:esp12e_smartconfig]
extends = env:esp12e
build_flags =
	${env:esp12e.build_flags}
	-D WEB_CONFIG_ENABLED=0

[env:esp12e_dht]
extends = env:esp12e
build_flags =
	${env:esp12e.build_flags}
	-D DHT_ENABLED=1

[env:esp12e_no_animation]
extends = env:esp12e
build_flags =
	${env:esp12e.build_flags}
	-D ANIMATION_CHOICE=0
